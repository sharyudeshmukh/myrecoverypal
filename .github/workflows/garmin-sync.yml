# Put this file in your repo at: .github/workflows/garmin-sync.yml
name: Garmin sync

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC). Use "*/30 * * * *" for every 30 min.
  workflow_dispatch:         # lets you hit "Run workflow" manually (e.g. for a backfill)
    inputs:
      days:
        description: "Days to sync"
        default: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "garminconnect>=0.3" requests

      - name: Check secrets
        run: |
          missing=0
          [ -z "$GARMIN_TOKENS" ] && echo "::error::GARMIN_TOKENS secret is missing or empty in THIS repo" && missing=1
          [ -z "$INGEST_URL" ]    && echo "::error::INGEST_URL secret is missing or empty in THIS repo" && missing=1
          [ -z "$INGEST_TOKEN" ]  && echo "::error::INGEST_TOKEN secret is missing or empty in THIS repo" && missing=1
          exit $missing
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}

      - name: Restore Garmin tokens
        run: |
          mkdir -p ~/.garminconnect
          printf '%s' "$GARMIN_TOKENS" > ~/.garminconnect/garmin_tokens.json
          chmod 600 ~/.garminconnect/garmin_tokens.json
          python -c "import json,os; json.load(open(os.path.expanduser('~/.garminconnect/garmin_tokens.json')))" \
            || { echo "::error::GARMIN_TOKENS is not valid JSON - re-copy it with: pbcopy < ~/.garminconnect/garmin_tokens.json"; exit 1; }
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}

      - name: Sync
        run: python garmin_sync.py --days "${{ github.event.inputs.days || '2' }}"
        env:
          TZ: America/Los_Angeles   # so "today" means your local day, not UTC
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
